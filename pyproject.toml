[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fleet-monitor"
version = "0.1.0"
description = "基于 Prefect 的多主机健康巡检与 SSH 登录审计"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "prefect>=3.0",
    "paramiko>=3.4",
    "streamlit>=1.40",
    "pandas>=2.2",
    "plotly>=5.24",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
fleet-monitor = "fleet_monitor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
